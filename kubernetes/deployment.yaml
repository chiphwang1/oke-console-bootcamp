apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-oke
  labels:
    app.kubernetes.io/name: hello-oke
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-oke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-oke
    spec:
      containers:
        - name: web
          image: docker.io/hashicorp/http-echo:1.0.0
          args: ["-text=hello from OKE monitoring lab", "-listen=:5678"]
          ports:
            - name: http
              containerPort: 5678
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
