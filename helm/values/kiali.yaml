# Dedicated, disposable training clusters only. Never expose this publicly.
auth:
  strategy: anonymous
deployment:
  view_only_mode: true
  service_type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
external_services:
  prometheus:
    url: http://prometheus-server.istio-system.svc.cluster.local:80
  grafana:
    enabled: false
  tracing:
    enabled: false
server:
  web_root: /kiali
