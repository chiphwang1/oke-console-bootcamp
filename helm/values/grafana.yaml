# Disposable lab only: anonymous Viewer, ClusterIP, localhost port-forward.
fullnameOverride: grafana
replicas: 1
rbac:
  create: false
automountServiceAccountToken: false
serviceAccount:
  automountServiceAccountToken: false
service:
  type: ClusterIP
ingress:
  enabled: false
persistence:
  enabled: false
testFramework:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
# Leave headroom for memory outside the Go runtime (plugins, mappings, etc.).
# GOMEMLIMIT is a soft runtime target, not the Kubernetes container limit.
env:
  GOMEMLIMIT: 512MiB
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: OKE Prometheus
        uid: oke-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.istio-system.svc.cluster.local:80
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 15s
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: OKE Lab
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/default
grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  users:
    allow_sign_up: false
    viewers_can_edit: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/default/oke-lab.json
