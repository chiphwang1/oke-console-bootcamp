{{- if .Values.traffic.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-traffic
  labels:
    app: {{ .Release.Name }}-traffic
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-traffic
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-traffic
        version: v1
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: traffic
          image: {{ .Values.traffic.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- if .Values.traffic.loadEnabled }}
              deadline=$(( $(date +%s) + {{ .Values.traffic.durationSeconds }} ))
              worker=0
              while [ "$worker" -lt {{ .Values.traffic.concurrency }} ]; do
                (
                  while [ "$(date +%s)" -lt "$deadline" ]; do
                    curl --fail --silent --show-error --max-time 5 \
                      http://{{ .Release.Name }}:80/work >/dev/null || true
                  done
                ) &
                worker=$((worker + 1))
              done
              echo 'CPU load started; it will stop automatically.'
              wait
              echo 'CPU load finished; returning to baseline traffic.'
              {{- end }}
              while true; do
                curl --fail --silent --show-error --max-time 5 http://{{ .Release.Name }}:80/ || true
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
